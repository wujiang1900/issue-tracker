version: '3.8'
services:
   mongodb:
      image: mongo:latest
      container_name: mongodb
      environment:
         MONGO_INITDB_ROOT_USERNAME: admin
         MONGO_INITDB_ROOT_PASSWORD: password
         MONGO_INITDB_DATABASE: mymongodb
      restart: always
      ports:
      - 27017:27017
   issue-tracker:
      image: issue-tracker:1.0
      container_name: issue-tracker
      restart: always
      ports:
      - 8080:8080
      links:
      - mongodb
