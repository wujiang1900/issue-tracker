version: '3.8'

services:
  mongodb:
    image: mongo:latest
    container_name: mongodb
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: issuetracker
    volumes:
      - mongodb_data:/data/db
    networks:
      - issuetracker-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')", "--quiet"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  issuetracker-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: issueTracker
    ports:
      - "8081:8081"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATA_MONGODB_URI: mongodb://mongodb:27017/issuetracker
      ISSUETRACKER_SEED_FORCE: "true"
      ISSUETRACKER_SEED_WIPE: "true"
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - issuetracker-network
    restart: unless-stopped

volumes:
  mongodb_data:

networks:
  issuetracker-network:
    driver: bridge
