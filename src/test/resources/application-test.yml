debug: false

spring:
  data:
    mongodb:
      # Configure this to point to your local or external MongoDB instance
      # Default assumes MongoDB running locally on default port
      uri: mongodb://localhost:27017/issuetracker_test
      # Alternative: if you have MongoDB with authentication
      # uri: mongodb://username:password@localhost:27017/issuetracker_test
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.security.servlet.SecurityAutoConfiguration

issuetracker:
  seed:
    force: true
    wipe: true


logging:
  level:
    root: WARN
    com.issuetracker: INFO
    org.springframework.boot.autoconfigure: ERROR
