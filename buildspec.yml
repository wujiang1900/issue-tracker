version: 0.2

env:
  variables:
    JAVA_HOME: "/usr/lib/jvm/java-17-amazon-corretto"
    MAVEN_OPTS: "-Xmx1024m"
  parameter-store:
    DOCKER_HUB_USERNAME: /codebuild/dockerhub/username
    DOCKER_HUB_PASSWORD: /codebuild/dockerhub/password

phases:
  install:
    runtime-versions:
      java: corretto17
      docker: 20
    commands:
      - echo "Installing dependencies..."
      - echo "Maven version:"
      - mvn --version
      - echo "Java version:"
      - java -version
      - echo "Docker version:"
      - docker --version

  pre_build:
    commands:
      - echo "Pre-build phase started on `date`"
      - echo "Logging in to Amazon ECR..."
      - aws --version
      - AWS_ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
      - AWS_REGION=${AWS_DEFAULT_REGION:-us-east-1}
      - ECR_REPOSITORY_URI=$AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/issue-tracker
      - aws ecr get-login-password --region $AWS_REGION | docker login --username AWS --password-stdin $ECR_REPOSITORY_URI
      - COMMIT_HASH=$(echo $CODEBUILD_RESOLVED_SOURCE_VERSION | cut -c 1-7)
      - IMAGE_TAG=${COMMIT_HASH:=latest}
      - echo "Image tag is $IMAGE_TAG"
      - echo "Running tests..."

  build:
    commands:
      - echo "Build phase started on `date`"
      - echo "Building Maven project..."
      - mvn clean package -DskipTests
      - echo "Maven build completed successfully"
      - echo "Building Docker image..."
      - docker build -t issue-tracker:latest .
      - docker tag issue-tracker:latest $ECR_REPOSITORY_URI:latest
      - docker tag issue-tracker:latest $ECR_REPOSITORY_URI:$IMAGE_TAG
      - echo "Docker image built and tagged successfully"

  post_build:
    commands:
      - echo "Post-build phase started on `date`"
      - echo "Running unit tests..."
      - mvn test
      - echo "Pushing Docker images to ECR..."
      - docker push $ECR_REPOSITORY_URI:latest
      - docker push $ECR_REPOSITORY_URI:$IMAGE_TAG
      - echo "Docker images pushed successfully"
      - echo "Writing image definitions file for ECS deployment..."
      - printf '[{"name":"issue-tracker","imageUri":"%s"}]' $ECR_REPOSITORY_URI:$IMAGE_TAG > imagedefinitions.json
      - cat imagedefinitions.json
      - echo "Build completed on `date`"

artifacts:
  files:
    - imagedefinitions.json
    - target/*.jar
  name: issue-tracker-build-$(date +%Y%m%d-%H%M%S)

reports:
  test-report:
    files:
      - 'target/surefire-reports/*.xml'
    file-format: 'JUNITXML'

cache:
  paths:
    - '/root/.m2/**/*'
